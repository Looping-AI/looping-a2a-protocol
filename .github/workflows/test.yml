name: Test

on:
  push:
    branches:
      - main
  # Every pull request, not only those into `main`. A stacked PR — one branch
  # based on another that is still open — targets its parent, and a
  # `branches: [main]` filter silently reports "no checks" on it. Worse, the
  # retarget GitHub performs when the parent merges fires `edited`, which is not
  # in the default event list, so the tests would never run at all and the
  # branch could reach `main` unverified. This PR is the one that found that.
  pull_request:

# Superseded PR runs are cancelled; main is not, because Release keys off the
# run that Test completes there.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          # One source of truth with local dev; `engines` requires >=24.
          node-version-file: .nvmrc

      - run: npm ci

      # `npm test` alone would pass on code that neither typechecks nor formats:
      # vitest transpiles specs without checking them, and the type-aware
      # `no-deprecated` rule only runs here. `check` also builds, which the
      # export gate below reads.
      - run: npm run check

      - run: npm test

      # The defects that only fail at a consumer — and, for this package, the
      # one that would quietly undo the reason it was split out: a bare import
      # reaching `dist/`. See scripts/verify-exports.mjs.
      - run: npm run verify:exports
